<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encontro de Jovens com Cristo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #D62828;
    --yellow: #F7B731;
    --blue: #1A6FBF;
    --white: #F5F0E8;
    --black: #080808;
    --gold: #E8C84A;
  }

  body {
    background-color: var(--black);
    color: var(--white);
    font-family: 'Raleway', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 0;
  }

  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .logo-wrap {
    margin-bottom: 28px;
  }

  .logo-img {
    width: 150px;
    height: 200px;
  }


  .title {
    font-family: 'Cinzel', serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-align: center;
    line-height: 1.4;
    color: var(--white);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--yellow);
    text-align: center;
    margin-bottom: 36px;
    text-transform: uppercase;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--red), var(--yellow), var(--blue), transparent);
    margin-bottom: 32px;
    opacity: 0.7;
  }

  .buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 40px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 20px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Raleway', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    text-decoration: none;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .btn:hover {
    border-color: rgba(255,255,255,0.35);
    transform: translateX(4px);
    color: var(--white);
  }

  .btn:hover::before { opacity: 1; }

  .btn.red::before { background: linear-gradient(90deg, rgba(214,40,40,0.12), transparent); }
  .btn.yellow::before { background: linear-gradient(90deg, rgba(247,183,49,0.12), transparent); }
  .btn.blue::before { background: linear-gradient(90deg, rgba(26,111,191,0.12), transparent); }

  .btn.red { border-left: 2px solid var(--red); }
  .btn.yellow { border-left: 2px solid var(--yellow); }
  .btn.blue { border-left: 2px solid var(--blue); }

  .btn-icon {
    font-size: 18px;
    flex-shrink: 0;
    width: 24px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .btn-text {
    flex: 1;
    position: relative;
    z-index: 1;
  }

  .btn-arrow {
    font-size: 12px;
    opacity: 0.4;
    transition: all 0.25s ease;
    position: relative;
    z-index: 1;
  }

  .btn:hover .btn-arrow {
    opacity: 0.9;
    transform: translateX(3px);
  }

  footer {
    width: 100%;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 24px 0 36px;
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: auto;
  }

  .footer-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    text-decoration: none;
    color: rgba(255,255,255,0.5);
    transition: all 0.25s ease;
  }

  .footer-link:hover {
    border-color: var(--yellow);
    color: var(--yellow);
    transform: translateY(-3px);
  }

  .footer-link svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .stagger { animation: fadeUp 0.5s ease forwards; opacity: 0; }
  .s1 { animation-delay: 0.05s; }
  .s2 { animation-delay: 0.1s; }
  .s3 { animation-delay: 0.15s; }
  .s4 { animation-delay: 0.2s; }
  .s5 { animation-delay: 0.25s; }
  .s6 { animation-delay: 0.3s; }
  .s7 { animation-delay: 0.35s; }
  .s8 { animation-delay: 0.4s; }
  .s9 { animation-delay: 0.45s; }
  .s10 { animation-delay: 0.5s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
